# Mosquitto broker for the IS28 car and dashboard (Buddy 1).
#   mosquitto -c tools/dashboard/mosquitto.conf -v
# 1883: the car (plain MQTT over TCP). 9001: the dashboard in the browser
# (MQTT over WebSockets). Anonymous access: lab network only.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
